<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>내 캘린더</title>
<style>
  :root{
    --paper:#F8F6F2;
    --paper-2:#F1EEE7;
    --ink:#22262B;
    --ink-soft:#6B7078;
    --line:#DDD7CB;
    --line-strong:#C7C0B2;
    --accent:#2B4570;
    --accent-soft:#E7ECF3;
    --gold:#B08D57;
    --danger:#A6473A;
    --danger-soft:#F3E7E5;
    --radius:5px;
    --serif: Georgia, 'Iowan Old Style', 'Palatino Linotype', 'Noto Serif KR', serif;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:var(--sans);
    background:var(--paper);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  #app{max-width:1080px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;}

  /* ---------- Header ---------- */
  header{
    display:flex;align-items:center;justify-content:space-between;
    padding:18px 20px 10px;
    border-bottom:1px solid var(--line);
    gap:12px;
  }
  .brand{font-family:var(--serif);font-size:15px;letter-spacing:.02em;color:var(--ink-soft);}
  .nav{display:flex;align-items:center;gap:14px;}
  .nav button.arrow{
    background:none;border:1px solid var(--line-strong);border-radius:var(--radius);
    width:30px;height:30px;font-size:15px;color:var(--ink);cursor:pointer;
    display:flex;align-items:center;justify-content:center;
  }
  .nav button.arrow:hover{background:var(--paper-2);}
  .month-title{font-family:var(--serif);font-size:22px;min-width:150px;text-align:center;}
  .btn-primary{
    background:var(--accent);color:#fff;border:none;border-radius:var(--radius);
    padding:8px 14px;font-size:14px;cursor:pointer;font-family:var(--sans);
  }
  .btn-primary:hover{background:#213655;}
  .btn-ghost{
    background:none;border:1px solid var(--line-strong);color:var(--ink-soft);
    border-radius:var(--radius);padding:7px 12px;font-size:13px;cursor:pointer;
  }
  .btn-ghost:hover{background:var(--paper-2);color:var(--ink);}

  /* ---------- Legend / filter row ---------- */
  .legend{
    display:flex;flex-wrap:wrap;gap:8px;padding:10px 20px;border-bottom:1px solid var(--line);
  }
  .chip{
    display:flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;
    border:1px solid var(--line);font-size:12.5px;cursor:pointer;background:#fff;color:var(--ink-soft);
    user-select:none;
  }
  .chip .dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto;}
  .chip.off{opacity:.4;}
  .chip.manage{border-style:dashed;color:var(--ink-soft);}

  /* ---------- Layout: grid + side panel ---------- */
  .main{display:flex;flex:1;min-height:0;}
  .cal-wrap{flex:1;padding:14px 20px 24px;min-width:0;}
  .weekday-row{display:grid;grid-template-columns:repeat(7,1fr);margin-bottom:4px;}
  .weekday-row div{
    text-align:center;font-size:11.5px;color:var(--ink-soft);padding:6px 0;
  }
  .weekday-row div:first-child{color:var(--danger);}
  .weekday-row div:last-child{color:var(--accent);}
  .grid{
    display:grid;grid-template-columns:repeat(7,1fr);grid-auto-rows:1fr;
    border-top:1px solid var(--line);border-left:1px solid var(--line);
  }
  .cell{
    border-right:1px solid var(--line);border-bottom:1px solid var(--line);
    min-height:96px;padding:6px;cursor:pointer;position:relative;display:flex;flex-direction:column;gap:3px;
    background:#fff;
  }
  .cell:hover{background:var(--paper-2);}
  .cell.other-month{background:var(--paper);}
  .cell.other-month .daynum{color:#C6C0B4;}
  .cell.selected{background:var(--accent-soft);}
  .daynum{
    font-family:var(--serif);font-size:15px;width:22px;height:22px;
    display:flex;align-items:center;justify-content:center;border-radius:50%;
  }
  .cell.today .daynum{background:var(--accent);color:#fff;}
  .item-row{
    font-size:11px;padding:1px 4px;border-left:3px solid transparent;background:var(--paper-2);
    border-radius:2px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;color:var(--ink);
  }
  .item-row.done{text-decoration:line-through;color:var(--ink-soft);}
  .more-tag{font-size:10.5px;color:var(--ink-soft);padding-left:4px;}
  .dots-row{display:flex;gap:3px;flex-wrap:wrap;}
  .dots-row .dot{width:6px;height:6px;border-radius:50%;}

  /* ---------- Agenda side panel (desktop) ---------- */
  .panel{
    width:300px;flex:0 0 300px;border-left:1px solid var(--line);padding:16px 18px 24px;
    display:flex;flex-direction:column;gap:12px;background:var(--paper);
  }
  .panel h2{font-family:var(--serif);font-size:19px;margin:0 0 2px;font-weight:normal;}
  .panel .subd{font-size:12px;color:var(--ink-soft);margin-bottom:4px;}
  .agenda-list{display:flex;flex-direction:column;gap:6px;}
  .agenda-item{
    display:flex;align-items:flex-start;gap:8px;padding:8px 8px;border:1px solid var(--line);
    border-radius:var(--radius);background:#fff;
  }
  .agenda-item .dot{width:9px;height:9px;border-radius:50%;margin-top:4px;flex:0 0 auto;}
  .agenda-item .body{flex:1;min-width:0;cursor:pointer;}
  .agenda-item .t{font-size:13.5px;}
  .agenda-item .t.done{text-decoration:line-through;color:var(--ink-soft);}
  .agenda-item .time{font-size:11px;color:var(--ink-soft);}
  .agenda-item .memo{font-size:11.5px;color:var(--ink-soft);margin-top:2px;white-space:pre-wrap;}
  .agenda-item .del{background:none;border:none;color:var(--ink-soft);cursor:pointer;font-size:14px;line-height:1;padding:2px;}
  .agenda-item .del:hover{color:var(--danger);}
  .agenda-item input[type=checkbox]{margin-top:3px;}
  .empty-note{font-size:12.5px;color:var(--ink-soft);border:1px dashed var(--line-strong);border-radius:var(--radius);padding:14px;text-align:center;}

  /* ---------- Modal ---------- */
  .overlay{
    position:fixed;inset:0;background:rgba(34,38,43,.35);display:flex;align-items:center;justify-content:center;
    z-index:50;padding:16px;
  }
  .modal{
    background:#fff;border-radius:8px;width:100%;max-width:380px;padding:20px;
    max-height:90vh;overflow-y:auto;
  }
  .modal h3{font-family:var(--serif);font-weight:normal;font-size:19px;margin:0 0 14px;}
  .field{margin-bottom:12px;}
  .field label{display:block;font-size:12px;color:var(--ink-soft);margin-bottom:4px;}
  .field input[type=text],.field input[type=date],.field input[type=time],.field select,.field textarea{
    width:100%;border:1px solid var(--line-strong);border-radius:var(--radius);padding:8px 9px;font-size:14px;
    font-family:var(--sans);color:var(--ink);background:#fff;
  }
  .field textarea{resize:vertical;min-height:56px;}
  .row2{display:flex;gap:10px;}
  .row2 .field{flex:1;}
  .swatches{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
  .swatch{
    width:24px;height:24px;border-radius:50%;cursor:pointer;border:2px solid transparent;
    display:flex;align-items:center;justify-content:center;
  }
  .swatch.sel{border-color:var(--ink);}
  .checkline{display:flex;align-items:center;gap:8px;font-size:13.5px;margin-bottom:12px;}
  .modal-actions{display:flex;justify-content:space-between;align-items:center;margin-top:16px;}
  .modal-actions .right{display:flex;gap:8px;}
  .link-danger{background:none;border:none;color:var(--danger);font-size:13px;cursor:pointer;padding:6px 0;}

  /* category manage modal */
  .cat-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
  .cat-row input[type=text]{flex:1;}
  .cat-row .del{background:none;border:none;color:var(--ink-soft);cursor:pointer;font-size:14px;}
  .cat-row .del:hover{color:var(--danger);}

  /* ---------- Mobile ---------- */
  @media (max-width:820px){
    header{padding:14px 14px 8px;flex-wrap:wrap;}
    .brand{display:none;}
    .btn-ghost{padding:7px 9px;font-size:12px;}
    .cal-wrap{padding:10px 10px 8px;}
    .legend{padding:8px 10px;}
    .cell{min-height:56px;padding:4px;}
    .item-row{display:none;}
    .dots-row{margin-top:auto;}
    .main{flex-direction:column;}
    .panel{width:100%;flex:none;border-left:none;border-top:1px solid var(--line);padding:14px 14px 90px;}
    .month-title{font-size:19px;min-width:110px;}
  }
</style>
</head>
<body>
<div id="app"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
(function(){
  var STORAGE_EVENTS = 'events';
  var STORAGE_CATS = 'categories';
  var STORAGE_PEOPLE = 'people';
  var MY_PERSON_KEY = 'my-person-id'; // 기기별로만 저장 (동기화 안 됨)

  var DEFAULT_CATS = [
    {id:'work', name:'업무', color:'#4E8C8C'},
    {id:'personal', name:'개인', color:'#C1694F'},
    {id:'health', name:'건강', color:'#6B8F71'},
    {id:'etc', name:'기타', color:'#8B6F9E'}
  ];
  var SWATCH_COLORS = ['#4E8C8C','#C1694F','#6B8F71','#8B6F9E','#C9A227','#7A6A53','#2B4570','#A6473A'];
  var WEEKDAYS = ['일','월','화','수','목','금','토'];

  var state = {
    events: [],
    categories: DEFAULT_CATS.slice(),
    people: [],
    hiddenCats: {},
    hiddenPeople: {},
    myPersonId: null,
    currentMonth: startOfMonth(new Date()),
    selectedDate: fmtDate(new Date()),
    loaded: false,
    modal: null, // {type:'event'|'categories'|'people'|'sync'|'onboard', ...}
    sync: { enabled:false, code:null, db:null, unsub:null, connecting:false, error:null },
    applyingRemote: false
  };
  var SYNC_CONFIG_KEY = 'calendar-sync-config';
  // 붙여넣기가 안 되는 PC용으로 미리 채워둔 기본 동기화 설정 (필요 없으면 비워두면 됨: null)
  var EMBEDDED_SYNC = {
    firebaseConfig: {
      apiKey: "AIzaSyBVbdVCe_hmF-6ENuMzfR_Osf673vWEGJE",
      authDomain: "calender-a9472.firebaseapp.com",
      projectId: "calender-a9472",
      storageBucket: "calender-a9472.firebasestorage.app",
      messagingSenderId: "575451086534",
      appId: "1:575451086534:web:ddd994f25b8bddfbcca1c7",
      measurementId: "G-GCPEHZWQV3"
    },
    syncCode: "calendar-zoo"
  };

  function pad(n){return n<10?'0'+n:''+n;}
  function fmtDate(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
  function parseDate(s){var p=s.split('-');return new Date(parseInt(p[0]),parseInt(p[1])-1,parseInt(p[2]));}
  function startOfMonth(d){return new Date(d.getFullYear(),d.getMonth(),1);}
  function addDays(d,n){var r=new Date(d);r.setDate(r.getDate()+n);return r;}
  function addMonths(d,n){return new Date(d.getFullYear(),d.getMonth()+n,1);}
  function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
  function catById(id){
    for(var i=0;i<state.categories.length;i++){if(state.categories[i].id===id)return state.categories[i];}
    return {id:'',name:'미분류',color:'#999'};
  }
  function personById(id){
    for(var i=0;i<state.people.length;i++){if(state.people[i].id===id)return state.people[i];}
    return {id:'',name:'미지정',color:'#B9B2A2'};
  }

  // ---------- Storage (브라우저 localStorage — 기기별로 저장됨) ----------
  function loadAll(){
    try{
      var e = localStorage.getItem(STORAGE_EVENTS);
      state.events = e ? JSON.parse(e) : [];
    }catch(err){ state.events = []; }
    try{
      var c = localStorage.getItem(STORAGE_CATS);
      state.categories = c ? JSON.parse(c) : DEFAULT_CATS.slice();
    }catch(err){ state.categories = DEFAULT_CATS.slice(); }
    try{
      var p = localStorage.getItem(STORAGE_PEOPLE);
      state.people = p ? JSON.parse(p) : [];
    }catch(err){ state.people = []; }
    try{
      state.myPersonId = localStorage.getItem(MY_PERSON_KEY) || null;
    }catch(err){ state.myPersonId = null; }
    state.loaded = true;
    var savedSync = loadSyncConfig();
    if(savedSync && savedSync.firebaseConfig && savedSync.syncCode){
      connectSync(savedSync.firebaseConfig, savedSync.syncCode, true);
    } else if(EMBEDDED_SYNC && EMBEDDED_SYNC.firebaseConfig && EMBEDDED_SYNC.syncCode){
      connectSync(EMBEDDED_SYNC.firebaseConfig, EMBEDDED_SYNC.syncCode, true);
    }
    render();
  }
  function maybeOnboard(){
    if(state.modal) return;
    var known = state.myPersonId && state.people.some(function(p){return p.id === state.myPersonId;});
    if(!known){
      state.modal = {type:'onboard'};
    }
  }
  function saveEvents(){
    try{ localStorage.setItem(STORAGE_EVENTS, JSON.stringify(state.events)); }catch(err){}
    pushToRemote();
  }
  function saveCats(){
    try{ localStorage.setItem(STORAGE_CATS, JSON.stringify(state.categories)); }catch(err){}
    pushToRemote();
  }
  function savePeople(){
    try{ localStorage.setItem(STORAGE_PEOPLE, JSON.stringify(state.people)); }catch(err){}
    pushToRemote();
  }

  // ---------- Export / Import ----------
  function exportData(){
    var payload = {
      exportedAt: new Date().toISOString(),
      events: state.events,
      categories: state.categories,
      people: state.people
    };
    var blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    var d = new Date();
    var fname = 'my-calendar-backup-'+d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+'.json';
    a.href = url; a.download = fname;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
  }
  function importDataFromFile(file){
    var reader = new FileReader();
    reader.onload = function(){
      var data;
      try{ data = JSON.parse(reader.result); }
      catch(err){ alert('파일을 읽을 수 없어요. 올바른 백업 파일인지 확인해 주세요.'); return; }
      if(!data || !Array.isArray(data.events) || !Array.isArray(data.categories)){
        alert('백업 파일 형식이 올바르지 않아요.'); return;
      }
      var mode = confirm('가져온 데이터를 기존 데이터에 "합치기" 하시겠어요?\n확인 = 합치기 / 취소 = 기존 데이터를 덮어쓰기');
      if(mode){
        var existingIds = {};
        state.events.forEach(function(ev){ existingIds[ev.id]=true; });
        data.events.forEach(function(ev){ if(!existingIds[ev.id]) state.events.push(ev); });
        var existingCatIds = {};
        state.categories.forEach(function(c){ existingCatIds[c.id]=true; });
        data.categories.forEach(function(c){ if(!existingCatIds[c.id]) state.categories.push(c); });
        var existingPplIds = {};
        state.people.forEach(function(p){ existingPplIds[p.id]=true; });
        (data.people||[]).forEach(function(p){ if(!existingPplIds[p.id]) state.people.push(p); });
      } else {
        state.events = data.events;
        state.categories = data.categories.length ? data.categories : DEFAULT_CATS.slice();
        state.people = data.people || [];
      }
      saveEvents(); saveCats(); savePeople();
      render();
      alert('가져오기가 완료됐어요.');
    };
    reader.readAsText(file);
  }

  // ---------- Realtime sync (Firebase Firestore) ----------
  function parseFirebaseConfigText(text){
    var start = text.indexOf('{');
    var end = text.lastIndexOf('}');
    if(start === -1 || end === -1 || end < start) return null;
    var body = text.slice(start, end+1);
    body = body.replace(/([a-zA-Z0-9_]+)\s*:/g, '"$1":').replace(/'/g,'"');
    body = body.replace(/,\s*}/g, '}');
    try{ return JSON.parse(body); }catch(err){ return null; }
  }

  function loadSyncConfig(){
    try{
      var raw = localStorage.getItem(SYNC_CONFIG_KEY);
      return raw ? JSON.parse(raw) : null;
    }catch(err){ return null; }
  }
  function saveSyncConfigLocal(cfg){
    try{ localStorage.setItem(SYNC_CONFIG_KEY, JSON.stringify(cfg)); }catch(err){}
  }
  function clearSyncConfigLocal(){
    try{ localStorage.removeItem(SYNC_CONFIG_KEY); }catch(err){}
  }

  function connectSync(firebaseConfig, syncCode, silent){
    if(!window.firebase){
      state.sync.error = '동기화 라이브러리를 불러오지 못했어요. 인터넷 연결 또는 사내 네트워크가 외부 스크립트(gstatic.com)를 막고 있는지 확인해 주세요.';
      state.sync.enabled = false;
      if(!silent) alert(state.sync.error);
      return;
    }
    try{
      if(firebase.apps && firebase.apps.length){
        firebase.apps.slice().forEach(function(a){ a.delete(); });
      }
      firebase.initializeApp(firebaseConfig);
      var db = firebase.firestore();
      var docRef = db.collection('calendars').doc(syncCode);
      if(state.sync.unsub) state.sync.unsub();
      state.sync.unsub = docRef.onSnapshot(function(snap){
        state.applyingRemote = true;
        if(snap.exists){
          var data = snap.data();
          state.events = data.events || [];
          state.categories = (data.categories && data.categories.length) ? data.categories : DEFAULT_CATS.slice();
          state.people = data.people || [];
          try{ localStorage.setItem(STORAGE_EVENTS, JSON.stringify(state.events)); }catch(e){}
          try{ localStorage.setItem(STORAGE_CATS, JSON.stringify(state.categories)); }catch(e){}
          try{ localStorage.setItem(STORAGE_PEOPLE, JSON.stringify(state.people)); }catch(e){}
        } else {
          docRef.set({ events: state.events, categories: state.categories, people: state.people, updatedAt: new Date().toISOString() });
        }
        state.applyingRemote = false;
        render();
      }, function(err){
        state.sync.error = err.message;
        state.sync.enabled = false;
        render();
      });
      state.sync.enabled = true;
      state.sync.code = syncCode;
      state.sync.db = docRef;
      state.sync.error = null;
      saveSyncConfigLocal({ firebaseConfig: firebaseConfig, syncCode: syncCode });
    }catch(err){
      state.sync.error = err.message;
      state.sync.enabled = false;
      if(!silent) alert('연결에 실패했어요: '+err.message);
    }
  }

  function disconnectSync(){
    if(state.sync.unsub) state.sync.unsub();
    state.sync = { enabled:false, code:null, db:null, unsub:null, connecting:false, error:null };
    clearSyncConfigLocal();
    render();
  }

  function pushToRemote(){
    if(state.sync.enabled && state.sync.db && !state.applyingRemote){
      state.sync.db.set({ events: state.events, categories: state.categories, people: state.people, updatedAt: new Date().toISOString() }).catch(function(){});
    }
  }

  // ---------- Recurrence expansion ----------
  function occurrencesInRange(ev, rangeStart, rangeEnd){
    var out = [];
    var base = parseDate(ev.date);
    var end = ev.repeatEnd ? parseDate(ev.repeatEnd) : rangeEnd;
    if(end > rangeEnd) end = rangeEnd;
    if(ev.repeat === 'none'){
      if(base >= rangeStart && base <= rangeEnd) out.push(ev.date);
      return out;
    }
    var cursor = new Date(base);
    if(cursor < rangeStart){
      if(ev.repeat === 'daily'){
        cursor = new Date(rangeStart);
      } else if(ev.repeat === 'weekly'){
        while(cursor < rangeStart) cursor = addDays(cursor,7);
      } else if(ev.repeat === 'monthly'){
        while(cursor < rangeStart) cursor = new Date(cursor.getFullYear(), cursor.getMonth()+1, base.getDate());
      }
    }
    var guard = 0;
    while(cursor <= end && guard < 400){
      guard++;
      if(cursor >= rangeStart && cursor >= base){
        out.push(fmtDate(cursor));
      }
      if(ev.repeat === 'daily') cursor = addDays(cursor,1);
      else if(ev.repeat === 'weekly') cursor = addDays(cursor,7);
      else if(ev.repeat === 'monthly') cursor = new Date(cursor.getFullYear(), cursor.getMonth()+1, base.getDate());
      else break;
    }
    return out;
  }

  function occurrencesForCell(dateStr){
    var d = parseDate(dateStr);
    var list = [];
    state.events.forEach(function(ev){
      if(state.hiddenCats[ev.categoryId]) return;
      if(ev.ownerId && state.hiddenPeople[ev.ownerId]) return;
      var occ = occurrencesInRange(ev, d, d);
      if(occ.length){
        list.push({ev:ev, date:dateStr, done: ev.isTodo ? (ev.doneDates||[]).indexOf(dateStr) > -1 : false});
      }
    });
    list.sort(function(a,b){
      var ta = a.ev.time || '99:99', tb = b.ev.time || '99:99';
      return ta < tb ? -1 : ta > tb ? 1 : 0;
    });
    return list;
  }

  // ---------- Render ----------
  function render(){
    var app = document.getElementById('app');
    if(!state.loaded){
      app.innerHTML = '<div style="padding:40px;text-align:center;color:#6B7078;font-family:var(--sans)">불러오는 중…</div>';
      return;
    }
    var y = state.currentMonth.getFullYear(), m = state.currentMonth.getMonth();
    var monthLabel = y + '년 ' + (m+1) + '월';

    var html = '';
    html += '<header>';
    html += '  <div class="brand">MY CALENDAR</div>';
    html += '  <div class="nav">';

  function renderGridCells(y,m){
    var first = new Date(y,m,1);
    var gridStart = addDays(first, -first.getDay());
    var todayStr = fmtDate(new Date());
    var cellsHtml = '';
    for(var i=0;i<42;i++){
      var d = addDays(gridStart, i);
      var ds = fmtDate(d);
      var otherMonth = d.getMonth() !== m;
      var isToday = ds === todayStr;
      var isSel = ds === state.selectedDate;
      var occ = occurrencesForCell(ds);
      var cls = 'cell';
      if(otherMonth) cls += ' other-month';
      if(isToday) cls += ' today';
      if(isSel) cls += ' selected';

      var inner = '<div class="daynum">'+d.getDate()+'</div>';
      var shown = occ.slice(0,3);
      shown.forEach(function(o){
        var cat = catById(o.ev.categoryId);
        var owner = o.ev.ownerId ? personById(o.ev.ownerId) : null;
        var ownerDot = owner ? '<span class="dot" style="background:'+owner.color+';display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:3px;flex:0 0 auto;"></span>' : '';
        inner += '<div class="item-row'+(o.done?' done':'')+'" style="border-left-color:'+cat.color+';display:flex;align-items:center;">'+ownerDot+
          '<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">'+(o.ev.time? o.ev.time+' ' : '')+escapeHtml(o.ev.title)+'</span></div>';
      });
      if(occ.length > 3){
        inner += '<div class="more-tag">+'+(occ.length-3)+'개</div>';
      }
      var dotsHtml = '<div class="dots-row">'+occ.slice(0,5).map(function(o){
        var owner = o.ev.ownerId ? personById(o.ev.ownerId) : catById(o.ev.categoryId);
        return '<span class="dot" style="background:'+owner.color+'"></span>';
      }).join('')+'</div>';
      inner += dotsHtml;

      cellsHtml += '<div class="'+cls+'" data-act="select-date" data-date="'+ds+'">'+inner+'</div>';
    }
    return cellsHtml;
  }

  function renderPanel(){
    var d = parseDate(state.selectedDate);
    var label = (d.getMonth()+1)+'월 '+d.getDate()+'일 ('+WEEKDAYS[d.getDay()]+')';
    var occ = occurrencesForCell(state.selectedDate);
    var html = '<div class="panel">';
    html += '<h2>'+label+'</h2>';
    html += '<button class="btn-ghost" data-act="new-event-for-selected">+ 이 날짜에 일정 추가</button>';
    html += '<div class="agenda-list">';
    if(occ.length === 0){
      html += '<div class="empty-note">등록된 일정이 없습니다</div>';
    } else {
      occ.forEach(function(o){
        var ev = o.ev, cat = catById(ev.categoryId);
        var owner = ev.ownerId ? personById(ev.ownerId) : null;
        html += '<div class="agenda-item">';
        if(ev.isTodo){
          html += '<input type="checkbox" '+(o.done?'checked':'')+' data-act="toggle-done" data-id="'+ev.id+'" data-date="'+o.date+'" />';
        } else {
          html += '<span class="dot" style="background:'+cat.color+'"></span>';
        }
        html += '<div class="body" data-act="edit-event" data-id="'+ev.id+'">';
        html += '  <div class="t'+(o.done?' done':'')+'">'+escapeHtml(ev.title)+'</div>';
        var metaBits = [];
        if(ev.time) metaBits.push(ev.time);
        if(owner) metaBits.push('<span style="display:inline-flex;align-items:center;gap:3px;"><span class="dot" style="background:'+owner.color+';width:6px;height:6px;display:inline-block;border-radius:50%;"></span>'+escapeHtml(owner.name)+'</span>');
        metaBits.push(escapeHtml(cat.name));
        if(metaBits.length) html += '  <div class="time">'+metaBits.join(' · ')+'</div>';
        if(ev.memo) html += '  <div class="memo">'+escapeHtml(ev.memo)+'</div>';
        html += '</div>';
        html += '<button class="del" data-act="delete-event" data-id="'+ev.id+'">&times;</button>';
        html += '</div>';
      });
    }
    html += '</div></div>';
    return html;
  }

  function escapeHtml(s){
    return (s||'').replace(/[&<>"']/g, function(c){
      return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];
    });
  }

  // ---------- Modal rendering ----------

    if(state.modal.type === 'event'){

      wrap.innerHTML = onboardModalHtml();
    } else if(state.modal.type === 'sync'){
      wrap.innerHTML = syncModalHtml();
    }
    document.body.appendChild(wrap);
    bindModalEvents();
  }

  // ---------- Event binding ----------
  function bindEvents(){
    document.querySelectorAll('[data-act]').forEach(function(el){
      el.addEventListener('click', handleAction);
    });
    var fileInput = document.getElementById('import-file-input');
    if(fileInput){
      fileInput.addEventListener('change', function(){
        if(this.files && this.files[0]){
          importDataFromFile(this.files[0]);
        }
        this.value = '';
      });
    }
  }

  function handleAction(e){
    var act = this.getAttribute('data-act');
    if(act === 'prev'){ state.currentMonth = addMonths(state.currentMonth,-1); render(); }
    else if(act === 'next'){ state.currentMonth = addMonths(state.currentMonth,1); render(); }
    else if(act === 'today'){ state.currentMonth = startOfMonth(new Date()); state.selectedDate = fmtDate(new Date()); render(); }
    else if(act === 'select-date'){ state.selectedDate = this.getAttribute('data-date'); render(); }
    else if(act === 'toggle-cat'){ var id=this.getAttribute('data-id'); state.hiddenCats[id] = !state.hiddenCats[id]; render(); }
    else if(act === 'toggle-person'){ var pid=this.getAttribute('data-id'); state.hiddenPeople[pid] = !state.hiddenPeople[pid]; render(); }
    else if(act === 'filter-mine'){
      state.hiddenPeople = {};
      state.people.forEach(function(p){ if(p.id !== state.myPersonId) state.hiddenPeople[p.id] = true; });
      render();
    }
    else if(act === 'filter-all'){ state.hiddenPeople = {}; render(); }
    else if(act === 'manage-cats'){ state.modal = {type:'categories'}; renderModal(); }
    else if(act === 'manage-people'){ state.modal = {type:'people'}; renderModal(); }
    else if(act === 'whoami'){ state.modal = {type:'onboard'}; renderModal(); }
    else if(act === 'new-event'){ state.modal = {type:'event', editing:null, date: state.selectedDate}; renderModal(); }
    else if(act === 'export-data'){ exportData(); }
    else if(act === 'import-data'){ document.getElementById('import-file-input').click(); }
    else if(act === 'sync-settings'){ state.modal = {type:'sync'}; renderModal(); }
    else if(act === 'new-event-for-selected'){ state.modal = {type:'event', editing:null, date: state.selectedDate}; renderModal(); }
    else if(act === 'edit-event'){
      var ev = findEvent(this.getAttribute('data-id'));
      if(ev){ state.modal = {type:'event', editing: ev, date: ev.date}; renderModal(); }
    }
    else if(act === 'delete-event'){
      e.stopPropagation();
      if(confirm('이 일정을 삭제할까요? (반복 일정은 전체가 삭제됩니다)')){
        deleteEvent(this.getAttribute('data-id'));
        render();
      }
    }
    else if(act === 'toggle-done'){
      e.stopPropagation();
      toggleDone(this.getAttribute('data-id'), this.getAttribute('data-date'));
      render();
    }
  }

  function findEvent(id){
    for(var i=0;i<state.events.length;i++){ if(state.events[i].id===id) return state.events[i]; }
    return null;
  }
  function deleteEvent(id){
    state.events = state.events.filter(function(ev){ return ev.id !== id; });
    saveEvents();
  }
  function toggleDone(id, dateStr){
    var ev = findEvent(id);
    if(!ev) return;
    ev.doneDates = ev.doneDates || [];
    var idx = ev.doneDates.indexOf(dateStr);
    if(idx > -1) ev.doneDates.splice(idx,1); else ev.doneDates.push(dateStr);
    saveEvents();
  }

  function bindModalEvents(){
    var overlay = document.querySelector('.overlay');
    overlay.addEventListener('click', function(e){
      if(e.target === overlay){ state.modal = null; overlay.remove(); }
    });
    overlay.querySelectorAll('[data-act="close-overlay"]').forEach(function(el){
      el.addEventListener('click', function(e){
        if(el === overlay || el.closest('.modal')===null){ }
        state.modal = null; overlay.remove();
      });
    });

    if(state.modal.type === 'event'){
      var allDayBox = overlay.querySelector('#f-allday');
      var timeInput = overlay.querySelector('#f-time');
      allDayBox.addEventListener('change', function(){
        timeInput.disabled = allDayBox.checked;
        if(allDayBox.checked) timeInput.value = '';
      });
      overlay.querySelectorAll('#f-cats .swatch').forEach(function(sw){
        sw.addEventListener('click', function(){
          overlay.querySelectorAll('#f-cats .swatch').forEach(function(s){ s.classList.remove('sel'); });
          sw.classList.add('sel');
        });
      });
      overlay.querySelectorAll('#f-owners .swatch').forEach(function(sw){
        sw.addEventListener('click', function(){
          overlay.querySelectorAll('#f-owners .swatch').forEach(function(s){ s.classList.remove('sel'); });
          sw.classList.add('sel');
        });
      });
      overlay.querySelector('#f-repeat').addEventListener('change', function(){
        overlay.querySelector('#f-repeatend-wrap').style.display = this.value==='none' ? 'none':'';
      });
      var saveBtn = overlay.querySelector('[data-act="save-event"]');
      if(saveBtn) saveBtn.addEventListener('click', saveEventFromModal);
      var delBtn = overlay.querySelector('[data-act="delete-from-modal"]');
      if(delBtn) delBtn.addEventListener('click', function(){
        if(confirm('이 일정을 삭제할까요?')){
          deleteEvent(this.getAttribute('data-id'));
          state.modal = null;
          render();
        }
      });
    } else if(state.modal.type === 'sync'){
      var connectBtn = overlay.querySelector('[data-act="connect-sync"]');
      if(connectBtn) connectBtn.addEventListener('click', function(){
        var text = document.getElementById('f-fbconfig').value.trim();
        var code = document.getElementById('f-synccode').value.trim();
        if(!text || !code){ alert('Firebase 설정과 동기화 코드를 모두 입력해 주세요.'); return; }
        var cfg = parseFirebaseConfigText(text);
        if(!cfg || !cfg.apiKey || !cfg.projectId){ alert('Firebase 설정을 읽을 수 없어요. 콘솔에서 복사한 내용을 그대로 붙여넣어 주세요.'); return; }
        connectSync(cfg, code, false);
        state.modal = null;
        render();
      });
      var discBtn = overlay.querySelector('[data-act="disconnect-sync"]');
      if(discBtn) discBtn.addEventListener('click', function(){
        if(confirm('동기화를 끌까요? (이 기기의 데이터는 그대로 남아요)')){
          disconnectSync();
          state.modal = null;
        }
      });
    } else if(state.modal.type === 'onboard'){
      overlay.querySelectorAll('#ob-colors .swatch').forEach(function(sw){
        sw.addEventListener('click', function(){
          overlay.querySelectorAll('#ob-colors .swatch').forEach(function(s){ s.classList.remove('sel'); });
          sw.classList.add('sel');
        });
      });
      var skipBtn = overlay.querySelector('[data-act="skip-onboard"]');
      if(skipBtn) skipBtn.addEventListener('click', function(){ state.modal = null; render(); });
      var obSaveBtn = overlay.querySelector('[data-act="save-onboard"]');
      if(obSaveBtn) obSaveBtn.addEventListener('click', function(){
        var name = document.getElementById('ob-name').value.trim();
        if(!name){ alert('이름을 입력해 주세요.'); return; }
        var sel = overlay.querySelector('#ob-colors .swatch.sel');
        var color = sel ? sel.getAttribute('data-ob-color') : SWATCH_COLORS[0];
        var existing = state.people.filter(function(p){ return p.name === name; })[0];
        var pid;
        if(existing){
          existing.color = color;
          pid = existing.id;
        } else {
          pid = 'p-'+uid();
          state.people.push({ id: pid, name: name, color: color });
        }
        state.myPersonId = pid;
        try{ localStorage.setItem(MY_PERSON_KEY, pid); }catch(e){}
        savePeople();
        state.modal = null;
        render();
      });
    } else if(state.modal.type === 'people'){
      overlay.querySelectorAll('.swatch[data-person-color]').forEach(function(sw){
        sw.addEventListener('click', function(){
          var row = sw.closest('.cat-row');
          row.querySelectorAll('.swatch').forEach(function(s){ s.classList.remove('sel'); });
          sw.classList.add('sel');
        });
      });
      overlay.querySelectorAll('[data-act="delete-person"]').forEach(function(btn){
        btn.addEventListener('click', function(){
          btn.closest('.cat-row').remove();
        });
      });
      overlay.querySelector('[data-act="add-person"]').addEventListener('click', function(){
        var list = overlay.querySelector('#people-list');
        var id = 'p-'+uid();
        var div = document.createElement('div');
        div.className = 'cat-row';
        div.setAttribute('data-id', id);
        var swHtml = SWATCH_COLORS.map(function(col,i){
          return '<div class="swatch'+(i===0?' sel':'')+'" data-person-color="'+col+'" style="background:'+col+';width:18px;height:18px;"></div>';
        }).join('');
        div.innerHTML = '<div class="swatches">'+swHtml+'</div><input type="text" placeholder="이름" data-person-name /><button class="del" data-act="delete-person">&times;</button>';
        list.appendChild(div);
        div.querySelectorAll('.swatch').forEach(function(sw){
          sw.addEventListener('click', function(){
            div.querySelectorAll('.swatch').forEach(function(s){ s.classList.remove('sel'); });
            sw.classList.add('sel');
          });
        });
        div.querySelector('[data-act="delete-person"]').addEventListener('click', function(){ div.remove(); });
      });
      overlay.querySelector('[data-act="save-people"]').addEventListener('click', function(){
        var rows = overlay.querySelectorAll('.cat-row');
        var newPeople = [];
        rows.forEach(function(row){
          var name = row.querySelector('[data-person-name]').value.trim();
          var sel = row.querySelector('.swatch.sel');
          var color = sel ? sel.getAttribute('data-person-color') : SWATCH_COLORS[0];
          if(name){
            newPeople.push({ id: row.getAttribute('data-id') || ('p-'+uid()), name: name, color: color });
          }
        });
        state.people = newPeople;
        if(state.myPersonId && !newPeople.some(function(p){return p.id===state.myPersonId;})){
          state.myPersonId = null;
          try{ localStorage.removeItem(MY_PERSON_KEY); }catch(e){}
        }
        savePeople();
        state.modal = null;
        render();
      });
    } else if(state.modal.type === 'categories'){
      overlay.querySelectorAll('.swatch[data-cat-color]').forEach(function(sw){
        sw.addEventListener('click', function(){
          var row = sw.closest('.cat-row');
          row.querySelectorAll('.swatch').forEach(function(s){ s.classList.remove('sel'); });
          sw.classList.add('sel');
        });
      });
      overlay.querySelectorAll('[data-act="delete-cat"]').forEach(function(btn){
        btn.addEventListener('click', function(){
          btn.closest('.cat-row').remove();
        });
      });
      overlay.querySelector('[data-act="add-cat"]').addEventListener('click', function(){
        var list = overlay.querySelector('#cat-list');
        var id = 'cat-'+uid();
        var div = document.createElement('div');
        div.className = 'cat-row';
        div.setAttribute('data-id', id);
        var swHtml = SWATCH_COLORS.map(function(col,i){
          return '<div class="swatch'+(i===0?' sel':'')+'" data-cat-color="'+col+'" style="background:'+col+';width:18px;height:18px;"></div>';
        }).join('');
        div.innerHTML = '<div class="swatches">'+swHtml+'</div><input type="text" placeholder="카테고리 이름" data-cat-name /><button class="del" data-act="delete-cat">&times;</button>';
        list.appendChild(div);
        div.querySelectorAll('.swatch').forEach(function(sw){
          sw.addEventListener('click', function(){
            div.querySelectorAll('.swatch').forEach(function(s){ s.classList.remove('sel'); });
            sw.classList.add('sel');
          });
        });
        div.querySelector('[data-act="delete-cat"]').addEventListener('click', function(){ div.remove(); });
      });
      overlay.querySelector('[data-act="save-cats"]').addEventListener('click', function(){
        var rows = overlay.querySelectorAll('.cat-row');
        var newCats = [];
        rows.forEach(function(row){
          var name = row.querySelector('[data-cat-name]').value.trim();
          var sel = row.querySelector('.swatch.sel');
          var color = sel ? sel.getAttribute('data-cat-color') : SWATCH_COLORS[0];
          if(name){
            newCats.push({ id: row.getAttribute('data-id') || ('cat-'+uid()), name: name, color: color });
          }
        });
        if(newCats.length === 0){ alert('카테고리를 최소 1개 이상 남겨주세요.'); return; }
        state.categories = newCats;
        saveCats();
        state.modal = null;
        render();
      });
    }
  }

  function saveEventFromModal(){
    var title = document.getElementById('f-title').value.trim();
    if(!title){ alert('제목을 입력해 주세요.'); return; }
    var date = document.getElementById('f-date').value;
    var allDay = document.getElementById('f-allday').checked;
    var time = allDay ? '' : document.getElementById('f-time').value;
    var catSel = document.querySelector('#f-cats .swatch.sel');
    var catId = catSel ? catSel.getAttribute('data-cat') : state.categories[0].id;
    var ownerSel = document.querySelector('#f-owners .swatch.sel');
    var ownerId = ownerSel ? ownerSel.getAttribute('data-owner') : (state.myPersonId || null);
    var repeat = document.getElementById('f-repeat').value;
    var repeatEnd = document.getElementById('f-repeatend').value || null;
    var isTodo = document.getElementById('f-todo').checked;
    var memo = document.getElementById('f-memo').value;

    var editing = state.modal.editing;
    if(editing){
      editing.title = title; editing.date = date; editing.time = time || null;
      editing.categoryId = catId; editing.repeat = repeat; editing.repeatEnd = repeatEnd;
      editing.isTodo = isTodo; editing.memo = memo; editing.ownerId = ownerId;
    } else {
      state.events.push({
        id: uid(), title: title, date: date, time: time || null,
        categoryId: catId, repeat: repeat, repeatEnd: repeatEnd,
        isTodo: isTodo, memo: memo, doneDates: [], ownerId: ownerId
      });
    }
    saveEvents();
    state.selectedDate = date;
    state.currentMonth = startOfMonth(parseDate(date));
    state.modal = null;
    render();
  }

  loadAll();
})();
</script>
</body>
</html>
